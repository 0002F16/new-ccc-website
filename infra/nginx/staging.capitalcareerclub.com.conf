limit_req_zone $binary_remote_addr zone=ccc_analytics_staging:10m rate=2r/s;

# See capitalcareerclub.com.conf — same image cache, own zone and variable.
proxy_cache_path /var/cache/nginx/ccc_images_staging levels=1:2 keys_zone=ccc_images_staging:10m max_size=256m inactive=30d use_temp_path=off;
map $http_accept $ccc_staging_image_format {
    default     orig;
    ~image/webp webp;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.capitalcareerclub.com;

    client_max_body_size 1m;
    access_log off;

    # Keep the ACME challenge public so Certbot can provision TLS before the
    # staging password is shared.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /api/analytics/batch {
        auth_basic "CCC staging";
        auth_basic_user_file /etc/nginx/.htpasswd-ccc-staging;
        client_max_body_size 64k;
        limit_req zone=ccc_analytics_staging burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_next/static/ {
        alias /srv/ccc-website/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        auth_basic "CCC staging";
        auth_basic_user_file /etc/nginx/.htpasswd-ccc-staging;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache ccc_images_staging;
        proxy_cache_key "$request_uri|$ccc_staging_image_format";
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/(proof|images|logos)/ {
        auth_basic "CCC staging";
        auth_basic_user_file /etc/nginx/.htpasswd-ccc-staging;
        root /srv/ccc-website/current/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        auth_basic "CCC staging";
        auth_basic_user_file /etc/nginx/.htpasswd-ccc-staging;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
