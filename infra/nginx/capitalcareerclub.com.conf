limit_req_zone $binary_remote_addr zone=ccc_analytics:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ccc_apply:10m rate=6r/m;

# Optimised images live outside the release dir, so they survive deploys.
# Next only varies the format on whether the browser accepts WebP, so key on
# that rather than on the full Accept header.
proxy_cache_path /var/cache/nginx/ccc_images levels=1:2 keys_zone=ccc_images:10m max_size=1g inactive=30d use_temp_path=off;
map $http_accept $ccc_image_format {
    default     orig;
    ~image/webp webp;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.capitalcareerclub.com;
    access_log off;
    return 301 https://capitalcareerclub.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name capitalcareerclub.com;

    client_max_body_size 1m;
    # Avoid persisting visitor IPs or query strings in Nginx access logs.
    access_log off;

    location = /api/analytics/batch {
        client_max_body_size 64k;
        limit_req zone=ccc_analytics burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/applications {
        # A CV upload of up to 10 MB plus the form fields.
        client_max_body_size 12m;
        limit_req zone=ccc_apply burst=4 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_next/static/ {
        alias /srv/ccc-website/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache ccc_images;
        proxy_cache_key "$request_uri|$ccc_image_format";
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Unhashed filenames, so a week rather than immutable.
    location ~ ^/(proof|images|logos)/ {
        root /srv/ccc-website/current/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
